# Hạ tầng cho môi trường local: MySQL 8 + Redis 7 (3 DB logic: 0 cache, 1 auth, 2 queue).
# PHP chạy trực tiếp (php artisan serve) hoặc qua Sail.
services:
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3309}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
        volumes:
            - 'shoe-mysql:/var/lib/mysql'
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD}']
            retries: 10
            timeout: 5s
    redis:
        image: 'redis:7-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        # auth cần bền: AOF bật; tách DB theo vai trò (xem config/database.php)
        command: ['redis-server', '--appendonly', 'yes']
        volumes:
            - 'shoe-redis:/data'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 10
            timeout: 5s
    # Tìm kiếm (tùy chọn): docker compose --profile search up -d meilisearch, rồi SEARCH_DRIVER=meilisearch + php artisan search:reindex
    meilisearch:
        image: 'getmeili/meilisearch:v1.12'
        profiles: ['search']
        ports:
            - '7700:7700'
        environment:
            MEILI_MASTER_KEY: '${MEILISEARCH_KEY:-masterKey}'
            MEILI_ENV: development
        volumes:
            - 'shoe-meili:/meili_data'
volumes:
    shoe-mysql:
    shoe-redis:
    shoe-meili:
