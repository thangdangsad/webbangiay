# Triển khai tham khảo (v1): nginx · php-fpm · mysql · redis-auth (noeviction + AOF) · redis-cache (queue + cache) · horizon · scheduler
# Chạy:  docker compose -f deploy/docker-compose.prod.yml --env-file api/.env.production up -d --build
x-app: &app
  build: { context: .., dockerfile: deploy/Dockerfile.api }
  env_file: ../api/.env.production
  environment:
    REDIS_AUTH_HOST: redis-auth
    REDIS_HOST: redis-cache
    DB_HOST: mysql
  volumes: [ 'storage:/var/www/html/storage' ]
  depends_on: [ mysql, redis-auth, redis-cache ]

services:
  nginx:
    image: nginx:1.27-alpine
    ports: [ '80:80' ]
    volumes: [ './nginx.conf:/etc/nginx/conf.d/default.conf:ro', 'storage:/var/www/html/storage:ro', 'public:/var/www/html/public:ro' ]
    depends_on: [ app ]
  app:
    <<: *app
    volumes: [ 'storage:/var/www/html/storage', 'public:/var/www/html/public' ]
    command: sh -c "php artisan config:cache && php artisan route:cache && php artisan storage:link --force && php-fpm"
  horizon:
    <<: *app
    command: php artisan horizon
  scheduler:
    <<: *app
    command: php artisan schedule:work
  mysql:
    image: mysql:8.4
    env_file: ../api/.env.production
    environment: { MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}', MYSQL_DATABASE: '${DB_DATABASE}', MYSQL_USER: '${DB_USERNAME}', MYSQL_PASSWORD: '${DB_PASSWORD}' }
    command: [ '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci' ]
    volumes: [ 'mysql:/var/lib/mysql' ]
  redis-auth:
    image: redis:7-alpine
    command: [ 'redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec', '--maxmemory-policy', 'noeviction' ]
    volumes: [ 'redis-auth:/data' ]
  redis-cache:
    image: redis:7-alpine
    command: [ 'redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru' ]

volumes: { storage: {}, public: {}, mysql: {}, redis-auth: {} }
